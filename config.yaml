# medisite server configuration — local development defaults.
# Any field omitted here falls back to its built-in default
# (see internal/config/config.go). Picked up automatically by `go run .`
# from the repo root; paths here are relative and need no elevated
# permissions to create.
#
# This is NOT what runs in production — that's a separate config at
# deploy/config.production.yaml, installed to /etc/medisite/config.yaml
# by deploy/install.sh. Keeping them as two files (rather than one
# config.yaml serving both purposes) avoids production-only concerns
# like an absolute, root-owned log_file path leaking into local dev.

addr: "127.0.0.1:8080"
content_dir: "content"
templates_dir: "templates"
static_dir: "static"
log_file: "medisite.log"
