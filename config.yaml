# medisite server configuration.
# Any field omitted here falls back to its built-in default
# (see internal/config/config.go).
#
# In production this file is installed to /etc/medisite/config.yaml by
# deploy/install.sh. content_dir/templates_dir/static_dir stay relative
# to the service's WorkingDirectory (/opt/medisite); log_file is given
# as an absolute path since it lives outside that directory.

addr: "127.0.0.1:8080"
content_dir: "content"
templates_dir: "templates"
static_dir: "static"
log_file: "/var/log/medisite/medisite.log"
